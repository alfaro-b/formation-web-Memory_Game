<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>
<body>

    <h1>Memory Game</h1>

    <p>Retrouve toutes les paires !</p>

    <div class="difficulty">
        <button data-pairs="6">Facile</button>
        <button data-pairs="8">Moyen</button>
        <button data-pairs="10">Difficile</button>
    </div>

    <div class="game-info">
        <p>Coups: <span id="moves">0</span></p>
        <p>Paires trouvées: <span id="pairs">0</span></p>
    </div>

    <div class="game-board">

    </div>

    <button class="restart-btn">Recommencer</button>

</body>
</html>
